# Rutas reales del prefijo (va en /etc/ld.so.conf.d/; lo copia scripts/subir-android.sh con @P@ =
# el prefijo). La glibc traduce /usr/lib a esto, y el broker del sandbox de Firefox (procesos RDD y
# Utility: ffmpeg del sistema para AAC/H.264) arma su lista de bibliotecas desde ld.so.conf, así que
# sin estas líneas niega abrir libavcodec ("no decoder found for audio/mp4a-latm").
/data/user/0/@P@/usr/lib
/data/data/@P@/usr/lib
