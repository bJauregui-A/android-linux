# Salida de audio hacia la app de Android: PCM S16LE 48 kHz estéreo por un FIFO
context.modules = [
  { name = libpipewire-module-pipe-tunnel
    args = {
      tunnel.mode = sink
      pipe.filename = "/tmp/audio-android"
      audio.format = S16LE
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      stream.props = { node.name = android node.description = "Android" priority.session = 2000 }
    }
  }
]
