# Proveedor X11 Directo: Servidor y compositor X11 nativo que presenta directamente
# en la superficie de Android, sin intermediación de Wayland ni Xwayland.
PROTOCOLO_PANTALLA=x11
TIPO_SESION=x11
VARIABLE_CONEXION_HOST=DISPLAY
VALOR_CONEXION_HOST=:0
VARIABLE_CONEXION_CLIENTE=DISPLAY
MARCADOR_PANTALLA=linux-session-display-x11
COMPROBACION_READY=socket-x11
TIEMPO_READY=20
CAPACIDADES_PROVEEDOR="x11-directo compositor-x11 socket-clientes"
# La app exporta WAYLAND_DISPLAY a todas las sesiones y GTK/Qt prefieren Wayland si existe: aquí solo hay X11.
unset WAYLAND_DISPLAY
export GDK_BACKEND=x11 QT_QPA_PLATFORM=xcb XDG_SESSION_TYPE=x11
export XKB_DEFAULT_LAYOUT=${XKB_DEFAULT_LAYOUT:-latam}
if [ -f /usr/local/lib/libudmabuf-shim.so ]; then
    case ":${LD_PRELOAD:-}:" in
        *:/usr/local/lib/libudmabuf-shim.so:*) ;;
        *) export LD_PRELOAD="/usr/local/lib/libudmabuf-shim.so${LD_PRELOAD:+:$LD_PRELOAD}" ;;
    esac
fi
