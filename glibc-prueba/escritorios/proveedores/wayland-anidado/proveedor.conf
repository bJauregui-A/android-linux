# Proveedor anidado actual: el compositor recibe el socket Wayland anfitrión y publica
# otro socket para clientes Linux. Las comprobaciones se interpretan por sesion-android.
PROTOCOLO_PANTALLA=wayland
TIPO_SESION=wayland
VARIABLE_CONEXION_HOST=WAYLAND_DISPLAY
VALOR_CONEXION_HOST=wayland-0
VARIABLE_CONEXION_CLIENTE=WAYLAND_DISPLAY
MARCADOR_PANTALLA=linux-session-display
COMPROBACION_READY=socket-wayland
TIEMPO_READY=20
CAPACIDADES_PROVEEDOR="wayland-anidado socket-clientes output-scale-wlr"
export XKB_DEFAULT_LAYOUT=${XKB_DEFAULT_LAYOUT:-latam}
if [ -f /usr/local/lib/libudmabuf-shim.so ]; then
    case ":${LD_PRELOAD:-}:" in
        *:/usr/local/lib/libudmabuf-shim.so:*) ;;
        *) export LD_PRELOAD="/usr/local/lib/libudmabuf-shim.so${LD_PRELOAD:+:$LD_PRELOAD}" ;;
    esac
fi
