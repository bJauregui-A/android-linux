[core]
plugins = alpha animate autostart command decoration expo fast-switcher grid move place resize switcher vswitch wm-actions

[input]
xkb_layout = latam

[output:WL-1]
scale = @ESCALA@

[autostart]
autostart_wf_shell = false
panel = wf-panel
background = wf-background

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty
binding_launcher = <super> KEY_A
command_launcher = fuzzel
